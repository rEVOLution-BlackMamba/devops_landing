# Local dev: docker compose up
# Site available at http://localhost:8080
# Source files are volume-mounted — edit and refresh without rebuilding.

services:
  devops-landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-landing:local
    container_name: devops-landing
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./main.js:/usr/share/nginx/html/main.js:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./.well-known:/usr/share/nginx/html/.well-known:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 64m
    cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/m;

log_format json_combined escape=json
  '{"time":"$time_iso8601",'
   '"addr":"$remote_addr",'
   '"method":"$request_method",'
   '"uri":"$request_uri",'
   '"status":$status,'
   '"bytes":$body_bytes_sent,'
   '"rt":$request_time,'
   '"ua":"$http_user_agent"}';

# Cache-Control per resource type via map — avoids the add_header inheritance
# pitfall where per-location add_header strips parent security headers.
map $uri $cache_ctl {
    ~*\.(css|js|svg)$   "public, max-age=31536000, immutable";
    ~index\.html        "no-cache, no-store, must-revalidate";
    default             "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # ── Security headers — all at server level so every location inherits them ──
    add_header Cache-Control          "$cache_ctl"                                                                    always;
    add_header X-Frame-Options        "SAMEORIGIN"                                                                    always;
    add_header X-Content-Type-Options "nosniff"                                                                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"                                               always;
    add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()"                                      always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                                                                   always;
    add_header Cross-Origin-Resource-Policy "same-origin"                                                                  always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-aWUsQZHEVflDdY7K2hwBThFMNk/PKovqC23wEvSeGUI='; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.simpleicons.org; connect-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';" always;

    # ── Route-specific tweaks (no add_header here — would break header inheritance) ──
    location ~* \.(css|js|svg)$ {
        access_log off;
    }

    location / {
        limit_req zone=per_ip burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ──────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript image/svg+xml
                    application/json font/woff2;

    access_log /var/log/nginx/access.log json_combined;

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
